<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1913"/>
      <stop offset="100%" stop-color="#040907"/>
    </radialGradient>
    
    <!-- Accent Glows -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>

    <!-- Glass Effect for Bubbles -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base BG -->
  <rect width="1200" height="360" fill="url(#bgGlow)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="150" fill="#25D366" opacity="0.15" filter="url(#blur)" />
  <circle cx="1000" cy="180" r="180" fill="#128C7E" opacity="0.15" filter="url(#blur)" />
  <circle cx="600" cy="360" r="120" fill="#075E54" opacity="0.2" filter="url(#blur)" />

  <!-- Grid Pattern overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" />
    <path d="M 200 0 L 200 360 M 400 0 L 400 360 M 600 0 L 600 360 M 800 0 L 800 360 M 1000 0 L 1000 360" />
  </g>

  <!-- Floating Glass Chat Bubble 1 (Left) -->
  <g transform="translate(100, 200) rotate(-10)" filter="url(#shadow)">
    <rect width="180" height="60" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <path d="M 16 60 L 0 76 L 0 45" fill="rgba(255,255,255,0.05)" />
    <rect x="20" y="20" width="100" height="8" rx="4" fill="rgba(255,255,255,0.5)" />
    <rect x="20" y="36" width="140" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
  </g>

  <!-- Floating Glass Chat Bubble 2 (Right) -->
  <g transform="translate(880, 80) rotate(5)" filter="url(#shadow)">
    <rect width="220" height="70" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <path d="M 204 70 L 220 86 L 220 55" fill="rgba(255,255,255,0.05)" />
    <rect x="20" y="24" width="140" height="8" rx="4" fill="#25D366" opacity="0.8" />
    <rect x="20" y="40" width="80" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
  </g>

  <!-- Center Content -->
  <g transform="translate(600, 180)" text-anchor="middle">
    
    <!-- WhatsApp Logo Icon (Modernized) -->
    <g transform="translate(0, -90)">
      <!-- Main Icon -->
      <path d="M0 -35 C 19.3 -35 35 -19.3 35 0 C 35 7.6 32.5 14.6 28.3 20.4 L 32 32 L 20.6 28.5 C 14.6 32.6 7.6 35 0 35 C -19.3 35 -35 19.3 -35 0 C -35 -19.3 -19.3 -35 0 -35 Z" fill="url(#primaryGradient)" filter="url(#shadow)"/>
      <path d="M-10.5 -12.5 C -11.5 -15 -12 -15 -13 -15 C -14 -15 -15 -14.8 -16 -13.5 C -17 -12 -19.5 -9 -19.5 -4 C -19.5 1 -15 6 -14.5 7 C -14 8 -9 16 -1.5 19 C 6 22 7.5 21 8.5 20 C 9.5 19 10.5 16 10.2 15 C 10 14 9.5 13.5 8 12.5 C 6.5 11.5 3 9.5 2.5 9 C 2 8.5 1.5 8.5 1 9.5 C 0.5 10.5 -1 12.5 -1.5 13 C -2 13.5 -3 13.5 -4.5 12.8 C -7.5 11.2 -10 9 -11.5 6 C -12 5.5 -12 5 -11.5 4.5 C -11 4 -10.5 3.5 -10 2.8 C -9.5 2.2 -9.2 1.8 -8.8 1 C -8.5 0 -8.8 -0.8 -9 -1.5 C -9.5 -2.5 -10 -10 -10.5 -12.5 Z" fill="#FFF"/>
    </g>

    <!-- Main Title -->
    <text y="0" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      WhatsApp UI Clone
    </text>
    
    <!-- Subtitle -->
    <text y="40" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#8696a0" letter-spacing="0.5">
      The Ultimate 2026-Style React Web Experience
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 85)">
      <g transform="translate(-250, 0)">
        <rect x="-50" y="-15" width="100" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
        <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#25D366" text-anchor="middle">React 19</text>
      </g>
      <g transform="translate(-130, 0)">
        <rect x="-60" y="-15" width="120" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
        <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#25D366" text-anchor="middle">Redux Toolkit</text>
      </g>
      <g transform="translate(0, 0)">
        <rect x="-60" y="-15" width="120" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
        <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#25D366" text-anchor="middle">Tailwind CSS 4</text>
      </g>
      <g transform="translate(120, 0)">
        <rect x="-50" y="-15" width="100" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
        <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#25D366" text-anchor="middle">Vite 7</text>
      </g>
      <g transform="translate(230, 0)">
        <rect x="-50" y="-15" width="100" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
        <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#25D366" text-anchor="middle">i18n + PWA</text>
      </g>
    </g>
  </g>
</svg>
