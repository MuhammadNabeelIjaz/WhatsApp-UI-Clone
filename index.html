<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp UI Clone - Dev.Muhammad Nabeel Ijaz</title>
  <script>
    // Prevent flash of wrong theme and set PWA title bar color immediately
    (function() {
      try {
        var mode = localStorage.getItem('themeMode') || 'system';
        var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        
        var metaThemeColor = document.createElement('meta');
        metaThemeColor.name = "theme-color";
        metaThemeColor.content = isDark ? "#111b21" : "#f0f2f5";
        document.head.appendChild(metaThemeColor);
        
        if (!isDark) {
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
